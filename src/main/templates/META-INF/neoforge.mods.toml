modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="To Be Determined"
description='''
ButcherCraft is a Minecraft industrial and regional simulation project with playable production workflows and workforce foundations.

This alpha is the Workforce Navigation Update. It includes the employee foundation, persistent employee identities, employment records, departments, business hours, shift observation, employee navigation, workstation reservations, diagnostics, and reliable plant-scale pathing. Employees navigate, reserve workstations, and wait; they do not yet operate machinery or automate production. Grinder, Patty Former, six Grinder recipes, the manual Beef Patties production chain, Production Order guidance, and deterministic platform foundations remain included from earlier alpha releases. Broader economy, worker automation, logistics, and expansion APIs remain in development.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
