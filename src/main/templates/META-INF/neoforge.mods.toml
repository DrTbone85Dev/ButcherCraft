modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="To Be Determined"
description='''
ButcherCraft is a Minecraft industrial and regional simulation project with playable production workflows, workforce foundations, and deterministic material handling.

This alpha is the Continuous Processing Update. Beef Trim, Ground Beef, and Beef Patties stack to 64 in practical Workstation-owned slots; bounded processing consumes recipe quantities and merges compatible output safely. Employees can visibly carry one Beef Trim from a Cutting Table to a Grinder or one Ground Beef from a Grinder to a Patty Former while preserving source remainders and exact in-transit ItemStack custody.

The Grinder now supports an explicit persistent Machine Run with START, STOP, restart-gated RESUME, RUNNING EMPTY, and OUTPUT BLOCKED states. The Patty Former remains an explicit one-cycle machine. Employees do not control Grinder Runs, operate the Patty Former, select workstations automatically, claim Production Orders, run Production-driven transfers, transport batches, or own inventory. Broader economy, autonomous production, machine wear, general Logistics, and expansion APIs remain in development.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
