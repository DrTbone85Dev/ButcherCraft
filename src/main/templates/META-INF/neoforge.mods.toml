modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="To Be Determined"
description='''
ButcherCraft is a Minecraft industrial and regional simulation project with playable production workflows and workforce foundations.

This alpha is the First Employee Automation Update. Employees can navigate, reserve workstations, and operate a Grinder through the existing deterministic Grinder, Execution, and Scheduler pipeline. The manual operator command preserves authoritative Grinder validation and owner-result observation without bypassing subsystem ownership. Employees do not transport products, operate the Patty Former, perform autonomous production, or claim Production Orders. Grinder, Patty Former, six Grinder recipes, the manual Beef Patties production chain, Production Order guidance, and deterministic platform foundations remain included from earlier alpha releases. Broader economy, worker automation, logistics, and expansion APIs remain in development.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
