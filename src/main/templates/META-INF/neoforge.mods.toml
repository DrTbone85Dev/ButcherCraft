modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="To Be Determined"
description='''
ButcherCraft is a Minecraft industrial and regional simulation project with playable production workflows, workforce foundations, and deterministic material handling.

This alpha is the Employee Machine Operation Update. Employees can be explicitly assigned a finite quantity at a Grinder or Patty Former, physically navigate to the machine, process bounded cycles, and stop safely at the requested target while retaining excess input. One compatible Material Handler may service the machine while its employee operator remains responsible.

Assignments and exact Machine Run references persist through save/reload and checkpoint recovery. Restart still requires explicit permitted RESUME; employees never resume automatically. Empty employee-operated machines wait only for proven compatible inbound material; otherwise the assignment stops and is interrupted. Blocked output preserves the same Run without consuming input. Cutting Table operation remains manual and discrete. Employees do not select workstations automatically, claim Production Orders, run Production-driven assignments, transport batches, or own inventory. Machine wear, damage, lubrication, maintenance, breakdowns, and general Logistics remain future work.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
