plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude('**/*.bbmodel')
    exclude('**/.cache/**')
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    addModdingDependenciesTo(sourceSets.test)

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (project.hasProperty('butchercraft.quickPlayWorld')) {
                programArguments.addAll(
                        '--quickPlaySingleplayer',
                        project.property('butchercraft.quickPlayWorld').toString()
                )
            }
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
            )
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods.getByName(project.mod_id)
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

var copyGameTestStructures = tasks.register('copyGameTestStructures', Copy) {
    from layout.projectDirectory.dir('gameteststructures')
    into layout.projectDirectory.dir('run/gameteststructures')
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn copyGameTestStructures
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    systemProperty 'butchercraft.projectDir', project.layout.projectDirectory.asFile.absolutePath
    systemProperty 'butchercraft.testRuntimeClasspath', sourceSets.test.runtimeClasspath.asPath
    if (project.hasProperty('butchercraft.r3cWorldRoot')) {
        systemProperty 'butchercraft.r3cWorldRoot', project.property('butchercraft.r3cWorldRoot')
    }
    if (project.hasProperty('butchercraft.r3cPublish')) {
        systemProperty 'butchercraft.r3cPublish', project.property('butchercraft.r3cPublish')
    }
    if (project.hasProperty('butchercraft.r3cSuccessor')) {
        systemProperty 'butchercraft.r3cSuccessor', project.property('butchercraft.r3cSuccessor')
    }
    if (project.hasProperty('butchercraft.r4WorldRoot')) {
        systemProperty 'butchercraft.r4WorldRoot', project.property('butchercraft.r4WorldRoot')
    }
}

var releaseVersion = version.toString()
var releaseModId = mod_id.toString()
var releaseJarFile = layout.buildDirectory.file("libs/${releaseModId}-${releaseVersion}.jar")
var verifyReleaseArtifact = tasks.register('verifyReleaseArtifact') {
    dependsOn tasks.named('jar')
    inputs.file(releaseJarFile)

    doLast {
        var expectedName = "${releaseModId}-${releaseVersion}.jar"
        var releaseJar = releaseJarFile.get().asFile
        if (!releaseJar.isFile()) {
            throw new GradleException("Expected release artifact ${expectedName} was not produced")
        }

        var archive = new java.util.zip.ZipFile(releaseJar)
        var metadataEntry = archive.getEntry('META-INF/neoforge.mods.toml')
        if (metadataEntry == null) {
            archive.close()
            throw new GradleException('Packaged release artifact does not contain NeoForge metadata')
        }
        var packagedMetadata
        try {
            packagedMetadata = archive.getInputStream(metadataEntry).getText('UTF-8')
        } finally {
            archive.close()
        }
        if (!packagedMetadata.contains("modId=\"${releaseModId}\"")) {
            throw new GradleException("Packaged NeoForge metadata does not contain mod id ${releaseModId}")
        }
        if (!packagedMetadata.contains("version=\"${releaseVersion}\"")) {
            throw new GradleException("Packaged NeoForge metadata does not contain version ${releaseVersion}")
        }
    }
}

tasks.named('check').configure {
    dependsOn verifyReleaseArtifact
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
